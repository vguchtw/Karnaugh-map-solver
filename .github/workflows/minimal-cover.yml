name: Karnaugh exact-cover regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  solver:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run real solver regression suite
        run: node --test tests/*.test.cjs
